name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY="ccdi-${GOOS}-${GOARCH}"
          go build -o "$BINARY" .
          tar -czf "${BINARY}.tar.gz" "$BINARY"

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ccdi-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
